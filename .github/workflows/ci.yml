name: verify
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      verify_hosted:
        description: Run against the dedicated fictional development Supabase project
        type: boolean
        default: false
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:runtime
      - run: npm run build
      - run: npm run smoke:api
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:setup
      - run: npm run test:e2e:contract
      - run: npm audit --audit-level=high
  hosted-development:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_hosted
    runs-on: ubuntu-latest
    environment: smarttownship-development
    env:
      APP_ENV: test
      DEMO_SEED_ACK: fictional-data-only
      DEMO_MODE: 'true'
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_CA_PEM: ${{ secrets.SUPABASE_DB_CA_PEM }}
      DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run demo:configure
      - run: npm run db:seed:demo
      - run: npm run test:integration
      - run: npm run test:services
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
