name: One-time dependency lock repair
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dependency-lock-repair.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin patched build and test dependencies
        run: |
          npm pkg set devDependencies.vite=7.3.7 devDependencies.vitest=5.0.5 devDependencies.typescript-eslint=8.72.0
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate synchronized clean dependency install
        run: npm ci
      - name: Enforce zero high or critical dependency advisories
        run: npm audit --audit-level=high
      - name: Run code and runtime checks
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run test:runtime
          npm run build
          npm run smoke:api
      - name: Commit verified, refreshed dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --exit-code && exit 0
          git commit -m "fix: upgrade vulnerable build tools and refresh npm lockfile"
          git push origin HEAD:main
